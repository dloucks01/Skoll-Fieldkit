name: Deploy Gen1Recomp Web to Pages

# Optional CI path: builds the web app from source (clones gen1recomp @ the
# pinned commit, applies the web patch, runs love.js) and deploys to GitHub
# Pages. To use it, set Settings → Pages → Source: "GitHub Actions".
#
# The simpler alternative needs no CI: Settings → Pages → "Deploy from a
# branch" → this branch, folder /docs (the prebuilt site is committed there).

on:
  push:
    branches: [ claude/iphone-rom-emulation-wjm9cq ]
    paths:
      - 'gen1recomp-web/**'
      - '.github/workflows/gen1recomp-web-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build web app (clone + patch gen1recomp, run love.js)
        run: bash gen1recomp-web/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gen1recomp-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
